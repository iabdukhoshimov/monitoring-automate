---
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Check alloy binary exists
      ansible.builtin.stat:
        path: /usr/local/bin/alloy
      register: alloy_binary

    - name: Assert binary is installed
      ansible.builtin.assert:
        that: alloy_binary.stat.exists and alloy_binary.stat.executable
        fail_msg: "alloy binary not found or not executable"

    - name: Check config file exists
      ansible.builtin.stat:
        path: /etc/alloy/config.alloy
      register: alloy_config_file

    - name: Assert config file is present
      ansible.builtin.assert:
        that: alloy_config_file.stat.exists
        fail_msg: "config.alloy not found"

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert alloy service is running
      ansible.builtin.assert:
        that:
          - "'alloy.service' in ansible_facts.services"
          - "ansible_facts.services['alloy.service'].state == 'running'"
        fail_msg: "alloy service is not running"

    - name: Assert alloy HTTP port is listening
      ansible.builtin.wait_for:
        port: 12345
        timeout: 30

    - name: Assert alloy ready endpoint responds
      ansible.builtin.uri:
        url: "http://localhost:12345/-/ready"
        status_code: 200
      register: alloy_ready
      retries: 10
      delay: 3
      until: alloy_ready.status == 200
