---
- name: Deploy event_service systemd unit
  ansible.builtin.template:
    src: event_service.service.j2
    dest: /etc/systemd/system/event_service.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart event_service

- name: Ensure event_service is started and enabled
  ansible.builtin.service:
    name: event_service
    state: started
    enabled: true
